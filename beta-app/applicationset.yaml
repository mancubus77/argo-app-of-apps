# Guestbook Beta Application - Managed Mode (Agent Architecture)
# Applications are created in per-agent namespaces on the hub.
# The principal routes each Application to the agent matching the namespace name.
# destination.server is https://kubernetes.default.svc — the agent transforms it to in-cluster.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-beta-hcp000
  namespace: hcp000
spec:
  project: hcp000-default
  source:
    repoURL: https://github.com/mancubus77/guestbook-kustomize
    targetRevision: main
    path: overlays/site1
    kustomize:
      namespace: dropzone-beta
  destination:
    server: https://kubernetes.default.svc
    namespace: dropzone-beta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-beta-hcp001
  namespace: hcp001
spec:
  project: hcp001-default
  source:
    repoURL: https://github.com/mancubus77/guestbook-kustomize
    targetRevision: main
    path: overlays/site2
    kustomize:
      namespace: dropzone-beta
  destination:
    server: https://kubernetes.default.svc
    namespace: dropzone-beta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
