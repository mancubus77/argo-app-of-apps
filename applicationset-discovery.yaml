apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-discovery
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/mancubus77/argo-app-of-apps
              revision: main
              directories:
                - path: "*"
          - merge:
              generators:
                - clusterDecisionResource:
                    configMapRef: acm-placement
                    labelSelector:
                      matchLabels:
                        cluster.open-cluster-management.io/placement: app-discovery-placement
                    requeueAfterSeconds: 180
                - clusters: {}
              mergeKeys:
                - server
  template:
    metadata:
      name: "{{path.basename}}-{{name}}"
      labels:
        app.kubernetes.io/name: "{{path.basename}}"
        apps.open-cluster-management.io/pull-to-ocm-managed-cluster: "true"
      annotations:
        apps.open-cluster-management.io/ocm-managed-cluster: "{{name}}"
        apps.open-cluster-management.io/ocm-managed-cluster-app-namespace: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/mancubus77/argo-app-of-apps
        targetRevision: main
        path: "{{path}}"
      destination:
        namespace: "{{path.basename}}"
        server: "{{server}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: app-discovery-placement
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            app-discovery: "true"
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: openshift-gitops
spec:
  clusterSet: default
---
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: app-discovery-gitops
  namespace: openshift-gitops
spec:
  argoServer:
    cluster: local-cluster
    argoNamespace: openshift-gitops
  placementRef:
    kind: Placement
    apiVersion: cluster.open-cluster-management.io/v1beta1
    name: app-discovery-placement
